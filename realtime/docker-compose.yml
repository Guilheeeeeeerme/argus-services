services:
  realtime:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: ws-gateway
    environment:
      PORT: 3003
      SERVICE_ROLE: ws-gateway
      API_PORT: 8002
      ARGUS_CONTRACTS_VERSION: ${ARGUS_CONTRACTS_VERSION:-1.0.0}
      CORE_AUTH_JWKS_URL: ${CORE_AUTH_JWKS_URL:-https://api.development.argus.com/.well-known/jwks.json}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://argus:argus@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: argus.events
      RABBITMQ_EVENT_DURABLE: "true"
      RABBITMQ_EVENT_PUBLISH_CONFIRM: "true"
      RABBITMQ_EVENT_NAMES: decision.created.v1,decision.resolved.v1
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ROLE: pubsub,short-lived-state
    expose: ["8002"]
    networks: [argus_dev]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  argus_dev:
    external: true
    name: ${ARGUS_NETWORK:-argus_dev}
