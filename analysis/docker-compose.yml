services:
  analysis:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: worker
    environment:
      PORT: 8080
      SERVICE_ROLE: worker-vlm
      ARGUS_CONTRACTS_VERSION: ${ARGUS_CONTRACTS_VERSION:-1.0.0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://argus:argus@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: argus.events
      RABBITMQ_EVENT_DURABLE: "true"
      RABBITMQ_EVENT_PUBLISH_CONFIRM: "true"
      RABBITMQ_EVENT_NAMES: sequence.ingested.v1,decision.created.v1,decision.resolved.v1
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ROLE: short-lived-state
      WORKER_QUEUES: ${WORKER_QUEUES:-vlm,aggregate,schedule}
    networks: [argus_dev]
    healthcheck:
      test: ["CMD-SHELL", "celery -A argus.workers.celery_app inspect ping --timeout=2 | grep -q pong"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  argus_dev:
    external: true
    name: ${ARGUS_NETWORK:-argus_dev}
