services:
  triage:
    build:
      context: ..
      dockerfile: triage/Dockerfile
    environment:
      ARGUS_CONTRACTS_VERSION: ${ARGUS_CONTRACTS_VERSION:-1.0.0}
      TRIAGE_API_URL: ${TRIAGE_API_URL:-https://api.development.argus.com}
      TRIAGE_WS_URL: ${TRIAGE_WS_URL:-wss://development.argus.com:3002}
    expose: ["3002"]
    networks: [argus_dev]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  argus_dev:
    external: true
    name: ${ARGUS_NETWORK:-argus_dev}
