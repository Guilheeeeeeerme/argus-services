services:
  capture:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: api-ingest
    environment:
      PORT: 3001
      SERVICE_ROLE: api-ingest
      API_PORT: 8001
      ARGUS_CONTRACTS_VERSION: ${ARGUS_CONTRACTS_VERSION:-1.0.0}
      CORE_ADMIN_API_URL: ${CORE_ADMIN_API_URL:-https://api.development.argus.com}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://argus:argus@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: argus.events
      RABBITMQ_EVENT_DURABLE: "true"
      RABBITMQ_EVENT_PUBLISH_CONFIRM: "true"
      RABBITMQ_EVENT_NAMES: sequence.ingested.v1
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ROLE: idempotency
    ports:
      - "${ARGUS_BIND_HOST:-127.0.0.1}:3001:8001"
    networks: [argus_dev]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  argus_dev:
    external: true
    name: ${ARGUS_NETWORK:-argus_dev}
